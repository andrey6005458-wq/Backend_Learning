        }

        .header h1 {

            color: #0b1a2b;

        }

        .header h1 .accent {

        }

        .header h1 .accent-purple {

        }

        .header .subtitle {

            font-weight: 500;
            color: #4a5a6e;
            letter-spacing: 0.3px;
            margin-top: 4px;
        }

        .badge {
            background: #eef2f6;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            color: #1e3a5f;
            border: 1px solid #dce2ea;
            white-space: nowrap;
        }

        .badge span {
            color: #2563eb;
        }

        .global-progress {
            background: #ffffff;
            border-radius: 16px;
            padding: 18px 28px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0;
        }

        .global-progress .label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 8px;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.5px;
        }

        .global-progress .label span:last-child {
            color: #2563eb;
        }

        .global-progress .track {
            width: 100%;
            height: 8px;
            background: #e9edf2;
            border-radius: 30px;
            overflow: hidden;
        }

        .global-progress .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            border-radius: 30px;
            transition: width 0.6s ease;
        }

        .module {
            background: #ffffff;
            border-radius: 16px;
            margin-bottom: 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0;
            overflow: hidden;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .module:hover {
            border-color: #bdd3eb;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);

            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            background: #f9fbfd;
            border-bottom: 1px solid #eef2f6;
            cursor: pointer;
            user-select: none;

            font-weight: 700;
            color: #0b1a2b;

            font-weight: 600;

            background: #eef2f6;

            justify-content: space-between;
            padding: 8px 14px;
            margin-top: 4px;
            border-radius: 10px;
            transition: background 0.15s;
            cursor: pointer;
            border-left: 3px solid transparent;
            flex-wrap: wrap;
            gap: 8px;
        }

        .topic:hover {
            background: #f5f8fc;
        }

        .topic .left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-width: 180px;
        }

        .topic .status {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            border-radius: 50%;
            border: 2px solid #dce2ea;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0;
            transition: all 0.3s;
        }

        .topic.done .status {
            border-color: #2563eb;
            background: #2563eb;
        }

        .topic.done .status::after {
            content: '✓';
            font-size: 14px;
            font-weight: 700;
            color: #fff;
        }

        .topic .name {
            font-size: 14px;
            font-weight: 500;
            color: #1a2a3a;
        }

        .topic .name .sub {
            font-size: 12px;
            font-weight: 400;
            color: #5a6e82;
            margin-left: 8px;
        }

            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            background: #ede9fe;
            color: #7c3aed;
            padding: 2px 12px;
            border-radius: 30px;
            margin-left: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;

            background: #2563eb;
            color: #fff;
            border-color: #2563eb;
        }

            border-left-color: #2563eb;
        }

        .topic.done .name {
            color: #4a5a6e;
        }

        .topic.done .name .sub {
            color: #6a7e92;
        }

            margin-top: 30px;
            display: flex;
            justify-content: flex-end;
        }

            background: transparent;
            border: 1px solid #dce2ea;
            color: #4a5a6e;

                { id: 't56', name: '⭐ 11.3 CI/CD и деплой', sub: 'GitHub Actions + облако', resources: [{ label: 'Kaggle', url: 'https://www.kaggle.com/' }] },
                { id: 't57', name: '⭐ 11.4 RAG-система', sub: 'LLM + векторная БД', resources: [{ label: 'Kaggle', url: 'https://www.kaggle.com/' }] },
                { id: 't58', name: '⭐ 11.5 Полный ML-пайплайн', sub: 'MLflow + Airflow', resources: [{ label: 'Kaggle', url: 'https://www.kaggle.com/' }] }
            ]
        }, {
            id: 'm12',
            title: '⚡ 12. MLOps (углублённо)',
            meta: '2–3 нед',
            topics: [
                { id: 't59', name: '12.1 Оркестрация', sub: 'Airflow, Prefect', resources: [{ label: 'Хабр', url: 'https://habr.com/ru/post/493264/' }] },
                { id: 't60', name: '12.2 Мониторинг моделей', sub: 'Evidently AI', resources: [{ label: 'Evidently AI', url: 'https://www.evidentlyai.com/ru/mlops-guides' }] }
            ]
        }, {
            id: 'm13',
            title: '🎯 13. Карьера и Soft Skills',
            meta: 'параллельно',
            topics: [
                { id: 't61', name: '13.1 Оформление портфолио', sub: 'GitHub, README.md', resources: [{ label: 'GitHub', url: 'https://github.com/' }] },
                { id: 't62', name: '13.2 Как составить резюме', sub: 'структура и советы', resources: [{ label: 'Хабр', url: 'https://habr.com/ru/post/660127/' }] },
                { id: 't63', name: '13.3 Подготовка к собеседованиям', sub: 'типовые вопросы', resources: [{ label: 'Хабр', url: 'https://habr.com/ru/post/551026/' }] }
            ]
        }];

        const STORAGE_KEY = 'ds_ml_ai_roadmap_complete';

        function loadProgress() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) {
                    const parsed = JSON.parse(data);
                    if (typeof parsed === 'object') return parsed;
                }
            } catch (e) { /* ignore */ }
            return {};
        }

        function saveProgress(progress) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
        }

        let progress = loadProgress();
        const allTopicIds = modules.flatMap(m => m.topics.map(t => t.id));

        let changed = false;
        allTopicIds.forEach(id => {
            if (!(id in progress)) {
                progress[id] = false;
                changed = true;
            }
        });
        if (changed) saveProgress(progress);

        function renderModules() {
            const container = document.getElementById('modulesContainer');
            let html = '';

            modules.forEach((module) => {
                const doneCount = module.topics.filter(t => progress[t.id] === true).length;
                const total = module.topics.length;
                html += `<div class="module">`;
                html += `<div class="module-header" data-module="${module.id}">`;
                html += `<h2>${module.title}</h2>`;
                html += `<span class="meta">${module.meta} · ${doneCount}/${total}</span>`;
                html += `</div>`;
                html += `<div class="module-body">`;
                module.topics.forEach(topic => {
                    const isDone = progress[topic.id] === true;
                    const isProject = topic.name.includes('⭐');
                    html += `<div class="topic ${isDone ? 'done' : ''}" data-topic="${topic.id}">`;
                    html += `<div class="left">`;
                    html += `<span class="status">${isDone ? '✅' : '⬜'}</span>`;
                    html += `<span class="name">${topic.name} <span class="sub">${topic.sub}</span>`;
                    if (isProject) {
                        html += `<span class="project-badge">⭐ проект</span>`;
                    }
                    html += `</span>`;
                    html += `</div>`;
                    html += `<div class="resources">`;
                    if (topic.resources && topic.resources.length) {
                        topic.resources.forEach(r => {
                            html += `<a href="${r.url}" target="_blank">${r.label}</a>`;
                        });
                    }
                    html += `</div>`;
                    html += `</div>`;
                });
                html += `</div>`;
                html += `</div>`;
            });

            container.innerHTML = html;

            document.querySelectorAll('.topic').forEach(el => {
                el.addEventListener('click', function(e) {
                    if (e.target.tagName === 'A') return;
                    const id = this.dataset.topic;
                    if (!id) return;
                    progress[id] = !progress[id];
                    saveProgress(progress);
                    renderModules();
                    updateGlobalProgress();
                });
            });

            document.querySelectorAll('.module-header').forEach(header => {
                header.addEventListener('click', function() {
                    const body = this.nextElementSibling;
                    if (body && body.classList.contains('module-body')) {
                        const display = window.getComputedStyle(body).display;
                        body.style.display = display === 'none' ? 'block' : 'none';
                    }
                });
            });

            updateGlobalProgress();
        }

        function updateGlobalProgress() {
            const all = allTopicIds.length;
            if (all === 0) return;
            let done = 0;
            allTopicIds.forEach(id => {
                if (progress[id] === true) done++;
            });
            const percent = Math.round((done / all) * 100);
            document.getElementById('progressPercent').textContent = `${percent}% (${done}/${all})`;
            document.getElementById('progressFill').style.width = `${percent}%`;
        }

        document.getElementById('resetBtn').addEventListener('click', function() {
            if (confirm('Сбросить весь прогресс?')) {
                allTopicIds.forEach(id => progress[id] = false);
                saveProgress(progress);
                renderModules();
                updateGlobalProgress();
            }
        });

        renderModules();
    })();
</script>
</body>
</html>
